[project]
name = "driftwood"
version = "0.1.0"
description = "Driftwood media interface backend"
authors = [
    { name = "Melle Moerkerk", email = "melle@vxl.sh" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "authlib>=1.9.10",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "lxml>=6.1.3",
    "numpy>=2.5.5",
    "pydantic-settings>=2.16.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
