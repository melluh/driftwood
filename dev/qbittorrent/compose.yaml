# qBittorrent behind ProtonVPN (gluetun) for testing Driftwood's downloads.
# See README.md in this directory. Start with: docker compose up -d

name: driftwood-qbittorrent

services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: driftwood-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set WIREGUARD_PRIVATE_KEY in .env}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-Netherlands}
      # Only P2P servers that forward a port, so peers can connect in.
      VPN_PORT_FORWARDING: "on"
      PORT_FORWARD_ONLY: "on"
      # Tell qBittorrent the forwarded port whenever it changes. Works without a password
      # because the seeded config lets localhost (= this network namespace) skip the login.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -q -O- --retry-connrefused --post-data
        "json={\"listen_port\":{{PORTS}},\"upnp\":false,\"random_port\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
      TZ: ${TZ:-Europe/Amsterdam}
    ports:
      # qBittorrent's WebUI lives in gluetun's network namespace, so it's published here.
      - 127.0.0.1:${WEBUI_PORT:-8080}:8080/tcp
    networks:
      default:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  # Writes a starting qBittorrent.conf on the first run only; qBittorrent owns it after that.
  qbittorrent-config:
    image: alpine:3.20
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /config/qBittorrent &&
        if [ -f /config/qBittorrent/qBittorrent.conf ]; then echo "config exists, leaving it";
        else cp /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf && echo "seeded config"; fi
    volumes:
      - ./data/config:/config
      - ./qBittorrent.conf:/seed/qBittorrent.conf:ro
    network_mode: none

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: driftwood-qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent-config:
        condition: service_completed_successfully
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Amsterdam}
      WEBUI_PORT: "8080"
    volumes:
      - ./data/config:/config
      # Driftwood sees this as ./data/downloads (map it with PATH_MAPPINGS).
      - ./data/downloads:/downloads
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed, so qBittorrent's config can let this subnet (Docker's port publishing
        # arrives from the gateway, 172.30.0.1) use the WebUI without logging in.
        - subnet: 172.30.0.0/24
